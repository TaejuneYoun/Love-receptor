  <style>
    :root {
      --background: #d3d3d3;
      --ink: #000000;
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--background);
    }

    body {
      overflow: hidden;
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
    }

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      perspective: 1450px;
      perspective-origin: 50% 48%;
      isolation: isolate;
    }

    .cloud {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      transform: rotateX(var(--scene-rx, 0deg)) rotateY(var(--scene-ry, 0deg));
      transform-style: preserve-3d;
      transition: transform 80ms linear;
      will-change: transform;
    }

    .tile {
      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: var(--layer);
      display: block;
      width: var(--w);
      color: inherit;
      text-decoration: none;
      transform-style: preserve-3d;
      animation: drift var(--duration) ease-in-out var(--delay) infinite alternate;
      will-change: transform;
      pointer-events: auto;
    }

    .molecule-layer {
      position: absolute;
      left: 50%;
      top: 49%;
      z-index: 1;
      width: min(64vw, 980px);
      height: min(78vh, 820px);
      transform: translate(-50%, -50%) translateZ(-260px);
      transform-style: preserve-3d;
    }

    .molecule-layer canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      opacity: .78;
      transition: opacity 220ms ease, filter 220ms ease;
    }

    .molecule-layer.hovered canvas {
      opacity: .96;
      filter: contrast(1.12);
    }

    .model-tooltip {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 300;
      max-width: min(310px, calc(100vw - 32px));
      padding: 7px 9px 8px;
      background: #000000;
      color: #ffffff;
      font-size: 10px;
      font-weight: 400;
      line-height: 1.35;
      letter-spacing: .01em;
      pointer-events: none;
      opacity: 0;
      transform: translate(14px, 14px);
      transition: opacity 120ms ease;
    }

    .model-tooltip.visible { opacity: 1; }

    .tile:hover,
    .tile:focus-visible {
      z-index: 100;
      outline: none;
    }

    .card {
      display: block;
      transform: translateZ(0) rotateX(var(--card-rx, 0deg)) rotateY(var(--card-ry, 0deg));
      transform-style: preserve-3d;
      transition: transform 260ms cubic-bezier(.22, 1, .36, 1);
      will-change: transform;
    }

    .tile:hover .card,
    .tile:focus-visible .card {
      transform: translateZ(72px) rotateX(var(--card-rx, 0deg)) rotateY(var(--card-ry, 0deg)) scale(1.045);
    }

    .tile:focus-visible .card::after {
      content: "";
      position: absolute;
      inset: -7px;
      border: 1px solid #000000;
      pointer-events: none;
    }

    .tile img {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
      filter: contrast(1.15);
      box-shadow: 0 4px 130px #ffffff;
      user-select: none;
      -webkit-user-drag: none;
    }

    .pages {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 200;
      display: flex;
      gap: 14px;
      font-size: 18px;
      white-space: nowrap;
      transform: translateX(-50%);
    }

    .pages a {
      color: var(--ink);
      text-decoration: none;
      opacity: .3;
      transition: opacity 160ms ease;
    }

    .pages a + a::before {
      content: none;
      margin-right: 0;
    }

    .pages a.active,
    .pages a:hover,
    .pages a:focus-visible {
      opacity: 1;
      outline: none;
    }

    .site-footer {
      position: fixed;
      left: 20px;
      bottom: 18px;
      z-index: 200;
      font-size: 18px;
      line-height: 1.4;
      letter-spacing: .01em;
      white-space: nowrap;
    }

    .site-footer a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 160ms ease;
    }

    .site-footer a:hover,
    .site-footer a:focus-visible {
      border-color: currentColor;
      outline: none;
    }

    body.is-transitioning .custom-cursor,
    body.is-transitioning .model-tooltip {
      opacity: 0 !important;
    }

    body.is-transitioning .tile {
      animation-play-state: paused;
    }

    .main-transition {
      position: fixed;
      inset: 0;
      z-index: 20000;
      overflow: hidden;
      pointer-events: auto;
    }

    .main-transition-box {
      position: absolute;
      left: var(--transition-left);
      top: var(--transition-top);
      width: var(--transition-width);
      height: var(--transition-height);
      overflow: hidden;
      background: #000000;
      animation: main-box-expand 680ms cubic-bezier(.76, 0, .24, 1) both;
      will-change: left, top, width, height;
    }

    .main-transition-art {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: contrast(1.15);
      transform-origin: 50% 50%;
      animation: main-art-collapse 900ms cubic-bezier(.65, 0, .35, 1) both;
      will-change: transform, opacity;
    }

    .main-transition-dot {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 2;
      width: 34px;
      height: 34px;
      margin: -17px 0 0 -17px;
      border-radius: 999px;
      background: #f1f0eb;
      box-shadow: 0 0 1px rgba(255, 255, 255, .5);
      animation: main-dot-disappear 770ms cubic-bezier(.22, 1, .36, 1) 550ms both;
      will-change: transform, opacity;
    }

    @keyframes main-box-expand {
      to {
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
      }
    }

    @keyframes main-art-collapse {
      0%, 20% {
        opacity: 1;
        transform: scale(1);
      }
      72% {
        opacity: .92;
        transform: scale(.075);
      }
      100% {
        opacity: 0;
        transform: scale(.008);
      }
    }

    @keyframes main-dot-disappear {
      0% {
        opacity: 0;
        transform: scale(.2);
      }
      18%, 56% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(.08);
      }
    }

    @keyframes drift {
      from {
        transform:
          translate3d(calc(-50% - var(--sway)), calc(-50% - var(--float) - 4px), var(--z))
          rotateX(var(--rx-a)) rotateY(var(--ry-a)) rotateZ(var(--rz-a));
      }
      to {
        transform:
          translate3d(calc(-50% + var(--sway)), calc(-50% + var(--float) + 4px), var(--z-end))
          rotateX(var(--rx-b)) rotateY(var(--ry-b)) rotateZ(var(--rz-b));
      }
    }

    @media (max-width: 820px) {
      body { overflow: hidden; }
      .scene {
        position: fixed;

        perspective: none;

      .tile:hover .card,

      .tile img { box-shadow: 0 4px 70px rgba(255, 255, 255, .86); }
      .pages { display: none; }
      .site-footer {
        left: 50%;
        bottom: 16px;
        width: calc(100% - 32px);

        text-align: center;
        transform: translateX(-50%);

    }

    @keyframes mobile-float {
      from { transform: translate3d(calc(-50% - 7px), calc(-50% - 8px), 0) rotate(-.5deg) scale(.98); }
      to { transform: translate3d(calc(-50% + 7px), calc(-50% + 8px), 0) rotate(.5deg) scale(1.02); }

      .tile:nth-child(7) { width: min(21.6vw, 416px); }

    }

    @media (prefers-reduced-motion: reduce) {
      .cloud { transition: none; }
      .tile { animation: none; }
      .card { transition: none; }
      .main-transition-box {
        inset: 0;
        width: 100vw;
        height: 100vh;
        animation: none;
      }
      .main-transition-art,
      .main-transition-dot {
        display: none;
      }
    }
  </style>

    if (window.matchMedia("(min-width: 821px) and (hover: hover) and (pointer: fine)").matches) {
      const modelData = document.createElement("script");
      modelData.src = "6TPK-data.js";
      modelData.onload = () => {
        const modelRenderer = document.createElement("script");
        modelRenderer.src = "molecule.js";
        document.body.appendChild(modelRenderer);
      };
      document.body.appendChild(modelData);
    }

  <script>
    (() => {
      const cloud = document.querySelector(".cloud");
      const tiles = document.querySelectorAll(".tile");
      const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;

      function renderParallax() {
        currentX += (targetX - currentX) * 0.075;
        currentY += (targetY - currentY) * 0.075;
        cloud.style.setProperty("--scene-ry", `${currentX * 4.2}deg`);
        cloud.style.setProperty("--scene-rx", `${currentY * -3.2}deg`);
        requestAnimationFrame(renderParallax);
      }

      if (finePointer.matches && !reducedMotion.matches) {
        window.addEventListener("pointermove", (event) => {
          targetX = event.clientX / window.innerWidth - 0.5;
          targetY = event.clientY / window.innerHeight - 0.5;
        }, { passive: true });

        document.documentElement.addEventListener("mouseleave", () => {
          targetX = 0;
          targetY = 0;
        });

        renderParallax();
      }

      tiles.forEach((tile) => {
        const card = tile.querySelector(".card");
        tile.addEventListener("pointermove", (event) => {
          if (!finePointer.matches || reducedMotion.matches) return;
          const rect = tile.getBoundingClientRect();
          const x = event.clientX / rect.width - rect.left / rect.width - 0.5;
          const y = event.clientY / rect.height - rect.top / rect.height - 0.5;
          card.style.setProperty("--card-ry", `${x * 9}deg`);
          card.style.setProperty("--card-rx", `${y * -9}deg`);
        });
        tile.addEventListener("pointerleave", () => {
          card.style.setProperty("--card-ry", "0deg");
          card.style.setProperty("--card-rx", "0deg");
        });
      });
    })();
  </script>
</body>
</html>
