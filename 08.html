  <script>
    (() => {
      const translations = {
        EN: [
          "Love gives naught but itself,",
          "and takes naught but from itself.",
          "Love possesses not,",
          "nor would it be possessed.",
          "Kahlil Gibran, Al-Nabī, 《The Prophet》"
        ],
        KOR: [
          "사랑은 오직 자신을 내어줄 뿐이며,",
          "오직 자신으로부터만 취한다.",
          "사랑은 아무것도 소유하지 않으며,",
          "누구에게도 소유되기를 원하지 않는다.",
          "Kahlil Gibran, Al-Nabī, 《The Prophet》"
        ]
      };

      const area = document.querySelector(".inscription");
      const canvas = area.querySelector("canvas");
      const artwork = area.querySelector(".glyph-artwork");
      const directionLayer = area.querySelector(".direction-markers");
      const translatedCopy = document.querySelector(".translated-copy");
      const languageButtons = document.querySelectorAll("[data-lang]");
      let language = /^ko\b/i.test(navigator.language) ? "KOR" : "EN";
      let languagePinned = false;
      let progress = 0;
      let dragging = false;
      let gestureProgress = 0;
      let gestureActivated = false;
      let gestureInvalid = false;
      let lastPointer = null;
      let characterSpans = [];
      let citationElement = null;
      let lastAdvanceTime = 0;
      let activePointerId = null;
      let autoFinishing = false;
      let latestGuide = null;
      const mobileInteraction = window.matchMedia("(max-width: 820px), (hover: none) and (pointer: coarse)").matches;
      const tabletHighlightBoost = window.matchMedia("(min-width: 744px) and (max-width: 1366px) and (min-height: 600px) and (any-pointer: coarse)").matches
        && !/(?:^|\/)07\.html$/i.test(window.location.pathname);
      const highResolutionHighlightBoost = window.matchMedia("(min-width: 3000px) and (min-height: 1600px)").matches;

      const sourceWidth = 4190;
      const sourceHeight = 2216;
      const crop = { x: 430, y: 650, width: 1600, height: 800 };

      function artworkLayout(width, height) {
        const scale = Math.min(width / crop.width, height / crop.height) * 0.84;
        const displayWidth = crop.width * scale;
        const displayHeight = crop.height * scale;
        return {
          scale,
          left: (width - displayWidth) / 2,
          top: (height - displayHeight) / 2,
          width: displayWidth,
          height: displayHeight
        };
      }

      function positionArtwork(width, height) {
        const layout = artworkLayout(width, height);
        artwork.style.width = `${sourceWidth * layout.scale}px`;
        artwork.style.height = `${sourceHeight * layout.scale}px`;
        artwork.style.left = `${layout.left - crop.x * layout.scale}px`;
        artwork.style.top = `${layout.top - crop.y * layout.scale}px`;
        const clipInset = `inset(${crop.y * layout.scale}px ${(sourceWidth - crop.x - crop.width) * layout.scale}px ${(sourceHeight - crop.y - crop.height) * layout.scale}px ${crop.x * layout.scale}px)`;
        artwork.style.clipPath = clipInset;
        artwork.style.webkitClipPath = clipInset;
        return layout;
      }

      function makeGuide(width, height) {
        const points = [];
        const segments = [];
        const layout = artworkLayout(width, height);
        const strokeWidth = Math.max(28, 280 * layout.scale);
        const right = layout.left + 1485 * layout.scale;
        const left = layout.left + 70 * layout.scale;
        const rows = [
          { y: 207 },
          { y: 566 }
        ];

        rows.forEach((row, index) => {
          const y = layout.top + row.y * layout.scale;
          if (index === 0) points.push({ x: right, y });
          points.push({ x: left, y });
          segments.push("line");
          if (index === rows.length - 1) return;
          points.push({ x: right, y: layout.top + rows[index + 1].y * layout.scale });
          segments.push("fold");
        });

        if (mobileInteraction) {
          const mobileGuideInset = strokeWidth / 2 + 2;
          points.forEach((point) => {
            point.x = Math.max(mobileGuideInset, Math.min(width - mobileGuideInset, point.x));
            point.y = Math.max(mobileGuideInset, Math.min(height - mobileGuideInset, point.y));
          });
        }

        const cumulative = [0];
        for (let index = 1; index < points.length; index += 1) {
          cumulative.push(cumulative[index - 1] + Math.hypot(
            points[index].x - points[index - 1].x,
            points[index].y - points[index - 1].y
          ));
        }
        return {
          points,
          segments,
          cumulative,
          total: cumulative[cumulative.length - 1] || 1,
          lineWidth: strokeWidth
        };
      }

      function updateDirectionMarkers(guide) {
        if (!directionLayer) return;
        directionLayer.replaceChildren();
        const contentSegments = guide.segments
          .map((kind, index) => ({ kind, index }))
          .filter(({ kind, index }) => kind !== "fold" && guide.cumulative[index + 1] - guide.cumulative[index] > 1);
        const distance = guide.total * progress;
        let activeOrder = 0;
        contentSegments.forEach(({ index }, order) => {
          if (distance >= guide.cumulative[index + 1] - 0.5) {
            activeOrder = Math.min(order + 1, contentSegments.length - 1);
          }
        });
        let markerOrder = 0;
        guide.segments.forEach((segment, index) => {
          if (segment === "fold" || guide.cumulative[index + 1] - guide.cumulative[index] <= 1) return;
          const start = guide.points[index];
          const end = guide.points[index + 1];
          const dx = end.x - start.x;
          const dy = end.y - start.y;
          const length = Math.hypot(dx, dy) || 1;
          const horizontal = Math.abs(dx) >= Math.abs(dy);
          const marker = document.createElement("span");
          marker.textContent = horizontal ? (dx >= 0 ? "→" : "←") : "↓";
          marker.classList.toggle("current", markerOrder === activeOrder);
          const offset = guide.lineWidth * .68 + 8;
          const markerX = start.x - dx / length * offset;
          const markerY = start.y - dy / length * offset;
          const mobileMarkerInset = 10;
          marker.style.left = (mobileInteraction
            ? Math.max(mobileMarkerInset, Math.min(area.clientWidth - mobileMarkerInset, markerX))
            : markerX) + "px";
          marker.style.top = (mobileInteraction
            ? Math.max(mobileMarkerInset, Math.min(area.clientHeight - mobileMarkerInset, markerY))
            : markerY) + "px";
          directionLayer.appendChild(marker);
          markerOrder += 1;
        });
      }

      function draw() {
        const rect = area.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        canvas.style.width = `${rect.width}px`;
        canvas.style.height = `${rect.height}px`;
        positionArtwork(rect.width, rect.height);
        const context = canvas.getContext("2d");
        context.scale(dpr, dpr);
        context.lineJoin = "round";
        const guide = makeGuide(rect.width, rect.height);
        latestGuide = guide;
        const cursorHead = pointOnGuide(guide, progress);
        const cursorGuide = {
          x: rect.left + cursorHead.x,
          y: rect.top + cursorHead.y,
          snapRadius: guide.lineWidth,
          atStart: progress <= 0.001,
          complete: progress >= 0.999,
          locked: dragging || autoFinishing
        };
        window.__barbarianCursorGuide = cursorGuide;
        window.dispatchEvent(new CustomEvent("barbarian:guidecursor", { detail: cursorGuide }));
        updateDirectionMarkers(guide);
        context.lineWidth = guide.lineWidth;
        const limit = guide.total * progress;
        for (let index = 1; index < guide.points.length; index += 1) {
          const startDistance = guide.cumulative[index - 1];
          const endDistance = guide.cumulative[index];
          if (limit <= startDistance) break;
          const ratio = Math.min(1, (limit - startDistance) / (endDistance - startDistance));
          const start = guide.points[index - 1];
          const end = guide.points[index];
          const partial = {
            x: start.x + (end.x - start.x) * ratio,
            y: start.y + (end.y - start.y) * ratio
          };
          context.beginPath();
          context.moveTo(start.x, start.y);
          context.lineTo(partial.x, partial.y);
          context.strokeStyle = "#f1f0eb";
          context.lineCap = "round";
          context.stroke();
          if (ratio < 1) break;
        }
      }

      function buildTranslation() {
        translatedCopy.replaceChildren();
        characterSpans = [];
        citationElement = null;
        translations[language].forEach((line) => {
          if (!line) {
            const spacer = document.createElement("div");
            spacer.className = "spacer";
            translatedCopy.appendChild(spacer);
            return;
          }
          const paragraph = document.createElement("p");
          const isCitation = line.startsWith("Kahlil Gibran");
          if (isCitation) {
            paragraph.className = "citation";
            paragraph.textContent = line;
            citationElement = paragraph;
            translatedCopy.appendChild(paragraph);
            return;
          }
          Array.from(line).forEach((character) => {
            const span = document.createElement("span");
            span.className = "character";
            span.textContent = character === " " ? "\u00a0" : character;
            paragraph.appendChild(span);
            characterSpans.push(span);
          });
          translatedCopy.appendChild(paragraph);
        });
        updateTranslation();
      }

      function contentRevealProgress(guide, pathProgress) {
        if (!guide) return pathProgress;
        const distance = guide.total * pathProgress;
        let contentTotal = 0;
        let revealedContent = 0;
        guide.segments.forEach((kind, index) => {
          if (kind === "fold") return;
          const start = guide.cumulative[index];
          const end = guide.cumulative[index + 1];
          const length = Math.max(0, end - start);
          contentTotal += length;
          revealedContent += Math.max(0, Math.min(length, distance - start));
        });
        return contentTotal > 0 ? Math.min(1, revealedContent / contentTotal) : pathProgress;
      }

      function updateTranslation() {
        document.body.classList.toggle("highlight-complete", progress >= 0.999);
        const revealProgress = contentRevealProgress(latestGuide, progress);
        const revealed = revealProgress * characterSpans.length;
        characterSpans.forEach((span, index) => {
          const characterProgress = Math.min(1, Math.max(0, revealed - index));
          span.style.filter = `blur(${(1 - characterProgress) * 12}px)`;
          span.style.opacity = 0.16 + characterProgress * 0.84;
        });
        if (citationElement) {
          citationElement.classList.toggle("visible", progress >= 0.999 && !dragging);
        }
      }

      function pointerPosition(event) {
        const rect = area.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      }

      function pointOnGuide(guide, amount) {
        const target = guide.total * amount;
        for (let index = 1; index < guide.points.length; index += 1) {
          if (guide.cumulative[index] < target) continue;
          const startDistance = guide.cumulative[index - 1];
          const segmentDistance = guide.cumulative[index] - startDistance || 1;
          const ratio = Math.min(1, Math.max(0, (target - startDistance) / segmentDistance));
          const start = guide.points[index - 1];
          const end = guide.points[index];
          return {
            x: start.x + (end.x - start.x) * ratio,
            y: start.y + (end.y - start.y) * ratio,
            tangentX: (end.x - start.x) / segmentDistance,
            tangentY: (end.y - start.y) / segmentDistance
          };
        }
        const end = guide.points[guide.points.length - 1];
        return { x: end.x, y: end.y, tangentX: -1, tangentY: 0 };
      }

      function projectToGuide(pointer, guide, minimum, maximum) {
        let closest = null;
        for (let index = 1; index < guide.points.length; index += 1) {
          const start = guide.points[index - 1];
          const end = guide.points[index];
          const dx = end.x - start.x;
          const dy = end.y - start.y;
          const lengthSquared = dx * dx + dy * dy || 1;
          const t = Math.min(1, Math.max(0,
            ((pointer.x - start.x) * dx + (pointer.y - start.y) * dy) / lengthSquared
          ));
          const distanceAlong = guide.cumulative[index - 1] + Math.sqrt(lengthSquared) * t;
          const candidate = distanceAlong / guide.total;
          if (candidate < minimum || candidate > maximum) continue;
          const projectedX = start.x + dx * t;
          const projectedY = start.y + dy * t;
          const distance = Math.hypot(pointer.x - projectedX, pointer.y - projectedY);
          if (!closest || distance < closest.distance) closest = { candidate, distance };
        }
        return closest;
      }

      function segmentState(guide, amount) {
        const distance = guide.total * amount;
        for (let index = 0; index < guide.segments.length; index += 1) {
          const startDistance = guide.cumulative[index];
          const endDistance = guide.cumulative[index + 1];
          if (distance > endDistance && index < guide.segments.length - 1) continue;
          const segmentLength = endDistance - startDistance || 1;
          return {
            index,
            kind: guide.segments[index],
            local: Math.min(1, Math.max(0, (distance - startDistance) / segmentLength))
          };
        }
        return { index: guide.segments.length - 1, kind: "line", local: 1 };
      }

      function finalContentSegment(guide) {
        for (let index = guide.segments.length - 1; index >= 0; index -= 1) {
          if (guide.segments[index] !== "fold") return index;
        }
        return guide.segments.length - 1;
      }

      function finishAutomatically() {
        if (autoFinishing) return;
        autoFinishing = true;
        dragging = false;
        lastPointer = null;
        area.classList.remove("dragging");
        if (activePointerId !== null) {
          try {
            if (area.hasPointerCapture(activePointerId)) area.releasePointerCapture(activePointerId);
          } catch {}
        }
        activePointerId = null;
        const startProgress = progress;
        const startedAt = performance.now();
        const duration = 980;

        function animate(now) {
          const elapsed = Math.min(1, (now - startedAt) / duration);
          const eased = 1 - Math.pow(1 - elapsed, 3);
          progress = startProgress + (1 - startProgress) * eased;
          gestureProgress = progress;
          draw();
          updateTranslation();
          if (elapsed < 1) {
            requestAnimationFrame(animate);
            return;
          }
          progress = 1;
          gestureProgress = 1;
          autoFinishing = false;
          draw();
          updateTranslation();
        }
        requestAnimationFrame(animate);
      }

      function followGuide(event) {
        if (gestureInvalid || autoFinishing) return;
        const rect = area.getBoundingClientRect();
        const pointer = pointerPosition(event);
        const guide = makeGuide(rect.width, rect.height);
        const tolerance = guide.lineWidth * (mobileInteraction ? 1.4 : 0.9);
        const tangent = pointOnGuide(guide, gestureProgress);

        if (lastPointer) {
          const movementX = pointer.x - lastPointer.x;
          const movementY = pointer.y - lastPointer.y;
          const movementLength = Math.hypot(movementX, movementY);
          if (movementLength > 3) {
            const direction = (movementX * tangent.tangentX + movementY * tangent.tangentY) / movementLength;
            if (direction < -0.18 && !gestureActivated) {
              gestureInvalid = true;
              return;
            }
          }
        }
        lastPointer = pointer;

        const projection = projectToGuide(
          pointer,
          guide,
          Math.max(0, gestureProgress - 0.02),
          Math.min(1, gestureProgress + 0.095)
        );
        if (!projection || projection.distance > tolerance) return;
        const requestedAdvance = projection.candidate - gestureProgress;
        if (requestedAdvance <= 0.001) return;
        if (!gestureActivated && projection.candidate - progress < 0.006) return;

        const now = performance.now();
        const elapsed = Math.min(0.05, Math.max(1 / 120, (now - lastAdvanceTime) / 1000));
        lastAdvanceTime = now;
        const state = segmentState(guide, gestureProgress);
        const foldGap = (index) => {
          const start = guide.points[index];
          const end = guide.points[index + 1];
          const previous = guide.points[Math.max(0, index - 1)];
          const previousDx = start.x - previous.x;
          const previousDy = start.y - previous.y;
          return Math.abs(previousDx) >= Math.abs(previousDy)
            ? Math.abs(end.y - start.y)
            : Math.abs(end.x - start.x);
        };
        const foldGaps = guide.segments
          .map((kind, index) => kind === "fold" ? foldGap(index) : 0)
          .filter((gap) => gap > 0);
        const interlineGap = state.kind === "fold" ? foldGap(state.index) : 0;
        const largestInterlineGap = foldGaps.length ? Math.max(...foldGaps) : 0;
        const shortFold = state.kind === "fold"
          && largestInterlineGap > 0
          && interlineGap < largestInterlineGap * 0.98;
        const baseHighlightRate = 0.165;
        let maximumRate = baseHighlightRate;
        if (state.kind === "fold") maximumRate *= mobileInteraction ? 0.84 : 1.68;
        if (shortFold) maximumRate *= 0.7;
        if (mobileInteraction) maximumRate *= state.kind === "fold" ? 4 : 3;
        if (tabletHighlightBoost && state.kind !== "fold") maximumRate *= 1.5;
        if (mobileInteraction) maximumRate *= 2;
        if (highResolutionHighlightBoost) maximumRate *= 2;
        const maximumAdvance = Math.max(0.00035, maximumRate * elapsed);

        gestureActivated = true;
        gestureProgress = Math.min(projection.candidate, gestureProgress + maximumAdvance);
        progress = Math.max(progress, gestureProgress);
        draw();
        updateTranslation();

        const finalIndex = finalContentSegment(guide);
        const finalStart = guide.cumulative[finalIndex];
        const finalEnd = guide.cumulative[finalIndex + 1];
        const finalLength = finalEnd - finalStart || 1;
        const finalLocal = (progress * guide.total - finalStart) / finalLength;
        if (finalLocal >= 0.8) finishAutomatically();
      }

      function beginDragFromPoint(event, pointerId = null) {
        if (autoFinishing || progress >= 1) return;
        const rect = area.getBoundingClientRect();
        const guide = makeGuide(rect.width, rect.height);
        const pointer = pointerPosition(event);
        const head = pointOnGuide(guide, progress);
        const startTolerance = guide.lineWidth * (mobileInteraction ? 1.65 : 1);
        if (Math.hypot(pointer.x - head.x, pointer.y - head.y) > startTolerance) return;

        if (pointerId !== null && typeof area.setPointerCapture === "function") {
          try { area.setPointerCapture(pointerId); } catch {}
        }
        activePointerId = pointerId;
        dragging = true;
        gestureProgress = progress;
        gestureActivated = false;
        gestureInvalid = false;
        lastPointer = pointer;
        lastAdvanceTime = performance.now();
        area.classList.add("dragging");
        draw();
      }

      function endDrag() {
        dragging = false;
        activePointerId = null;
        lastPointer = null;
        area.classList.remove("dragging");
        draw();
        updateTranslation();
      }

      const useTouchEvents = mobileInteraction && "ontouchstart" in window;
      if (useTouchEvents) {
        area.addEventListener("touchstart", (event) => {
          const touch = event.changedTouches[0];
          if (!touch) return;
          beginDragFromPoint(touch, touch.identifier);
          if (dragging && event.cancelable) event.preventDefault();
        }, { passive: false });
        area.addEventListener("touchmove", (event) => {
          if (!dragging) return;
          const touch = Array.from(event.touches).find((item) => item.identifier === activePointerId)
            || event.touches[0];
          if (!touch) return;
          if (event.cancelable) event.preventDefault();
          followGuide(touch);
        }, { passive: false });
        ["touchend", "touchcancel"].forEach((type) => {
          area.addEventListener(type, (event) => {
            if (!dragging) return;
            const ended = Array.from(event.changedTouches).some(
              (touch) => touch.identifier === activePointerId
            );
            if (!ended && event.touches.length) return;
            if (event.cancelable) event.preventDefault();
            endDrag();
          }, { passive: false });
        });
      } else {
        area.addEventListener("pointerdown", (event) => {
          beginDragFromPoint(event, event.pointerId);
        });
        area.addEventListener("pointermove", (event) => {
          if (dragging) followGuide(event);
        });
        ["pointerup", "pointercancel"].forEach((type) => {
          area.addEventListener(type, endDrag);
        });
      }

      function updateLanguageInterface() {
        document.documentElement.lang = language === "KOR" ? "ko" : "en";
        languageButtons.forEach((button) => {
          button.classList.toggle("active", language === "EN");
        });
      }

      async function detectLanguage() {
        const fallback = /^ko\b/i.test(navigator.language) ? "KOR" : "EN";
        const controller = typeof AbortController === "function" ? new AbortController() : null;
        const timeoutId = controller ? setTimeout(() => controller.abort(), 2000) : 0;
        try {
          const options = { cache: "no-store" };
          if (controller) options.signal = controller.signal;
          const response = await fetch("https://api.country.is/", options);
          if (!response.ok) throw new Error("Location unavailable");
          const location = await response.json();
          if (languagePinned) return;
          language = String(location.country || "").toUpperCase() === "KR" ? "KOR" : "EN";
        } catch {
          if (languagePinned) return;
          language = fallback;
        } finally {
          if (timeoutId) clearTimeout(timeoutId);
        }
        updateLanguageInterface();
        buildTranslation();
      }

      languageButtons.forEach((button) => {
        button.addEventListener("click", () => {
          languagePinned = true;
          language = "EN";
          updateLanguageInterface();
          buildTranslation();
        });
      });

      new ResizeObserver(draw).observe(area);
      updateLanguageInterface();
      buildTranslation();
      detectLanguage();
      draw();
    })();
  </script>
</body>
</html>
